<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Set the theme before anything paints, so a dark or custom choice does not flash white first.
      try {
        var p = JSON.parse(localStorage.getItem('taskhub.prefs') || '{}')
        var t = p.theme || 'system'
        var dark = matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = t === 'light' || t === 'dark' ? t : dark ? 'dark' : 'light'
        // Custom, built-in and workspace themes: the app caches their finished stylesheet.
        var c = JSON.parse(localStorage.getItem('taskhub.theme-css') || 'null')
        var safe = /[?&]safe(=|&|$)/.test(location.search)
        if (c && c.theme === t && c.css && !(safe && t.indexOf('ws:') === 0)) {
          document.documentElement.dataset.theme = c.base === 'dark' ? 'dark' : 'light'
          var s = document.createElement('style')
          s.id = 'taskhub-theme'
          s.textContent = c.css
          document.head.appendChild(s)
        }
        document.documentElement.dataset.priority = p.priority === 'dots' || p.priority === 'icons' ? p.priority : 'bars'
        document.documentElement.dataset.status = p.status === 'dots' || p.status === 'icons' ? p.status : 'rings'
      } catch (e) {
        document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      }
    </script>
    <title>Taskhub</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
