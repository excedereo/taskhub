services:
  taskhub:
    build:
      context: .
      args:
        # Optional: GIT_COMMIT=$(git rev-parse --short HEAD) docker compose up -d --build
        GIT_COMMIT: ${GIT_COMMIT:-}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /data/taskhub.db
    # Reachable only from this machine: put a reverse proxy with HTTPS in front.
    # Docker bypasses ufw/iptables rules, so publishing on 0.0.0.0 would expose it to everyone.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - taskhub-data:/data

volumes:
  taskhub-data:
